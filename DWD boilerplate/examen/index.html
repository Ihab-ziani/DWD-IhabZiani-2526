<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">🍽 Recipe Finder</span>
      <p class="tagline">Zoek, ontdek en bewaar recepten van over de hele wereld.</p>
    </div>
  </header>

  <!-- ===== ZOEKBALK ===== -->
  <main class="main-content">
    <section class="search-section" aria-label="Recepten zoeken">
      <div class="search-bar">
        <input
          type="text"
          id="zoekInput"
          class="zoek-input"
          placeholder="Zoek een recept, bv. pasta, chicken, soup…"
          aria-label="Zoekterm invoeren"
          autocomplete="off"
        >
        <button type="button" id="zoekKnop" class="zoek-knop" aria-label="Zoeken">
          Zoek
        </button>
      </div>
    </section>

    <!-- ===== STATUS / FOUTMELDING ===== -->
    <div id="statusBericht" class="status-bericht verborgen" role="status" aria-live="polite"></div>

    <!-- ===== RESULTATEN GRID ===== -->
    <section id="resultatenContainer" class="resultaten-grid" aria-label="Zoekresultaten">
      <!-- Receptkaarten worden hier dynamisch ingevoegd door script.js -->
    </section>
  </main>

  <!-- ===== MODAL VOOR RECEPT DETAILS ===== -->
  <div id="modalOverlay" class="modal-overlay verborgen" role="dialog" aria-modal="true" aria-labelledby="modalTitel">
    <div class="modal-kaart">

      <!-- Sluitknop bovenaan de modal -->
      <button type="button" id="modalSluit" class="modal-sluit" aria-label="Details sluiten">✕</button>

      <!-- Verborgen titel voor toegankelijkheid (aria-labelledby) -->
      <h2 id="modalTitel" class="visually-hidden">Recept details</h2>

      <!-- Inhoud wordt dynamisch gevuld door script.js -->
      <div id="modalInhoud" class="modal-inhoud">
        <!-- Tijdelijke laad-indicator -->
        <p class="laden-tekst">Recept laden…</p>
      </div>

    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script src="js/script.js"></script>
</body>
</html>
