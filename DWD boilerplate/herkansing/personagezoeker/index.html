<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagezoeker - Rick and Morty</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Font Awesome voor hartjes en iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="fas fa-rocket" aria-hidden="true"></span> Personagezoeker</h1>
            <p>Zoek personages uit Rick and Morty</p>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Zoek een personage (bv. Rick, Morty, ...)" aria-label="Zoekterm">
            <button type="button" id="searchBtn"><span class="fas fa-search" aria-hidden="true"></span> Zoek</button>
            <button type="button" id="favoritesBtn"><span class="fas fa-heart" aria-hidden="true"></span> Favorieten</button>
        </div>

        <div id="messageArea" class="message"></div>

        <div id="resultsContainer" class="results-grid">
            <!-- Personagekaarten worden dynamisch ingeladen -->
        </div>
    </div>

    <!-- Modaal venster voor details -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button type="button" class="close-modal" aria-label="Sluiten">&times;</button>
            <div id="modalBody">
                <!-- Dynamische details -->
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
